<div class="card">
    <div class="section-title" data-i18n="env_variables">Environment Variables (.env.local)</div>
    <div id="env-status-banner" style="display:none; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:14px;"></div>
    <div id="env-form" data-i18n="loading">Loading...</div>
    <div style="margin-top:20px; display:flex; gap:10px; align-items:center;">
        <button onclick="saveEnv()" data-i18n="save_changes">Save Changes</button>
        <button class="secondary" onclick="resetEnv()" data-i18n="reset_defaults">Reset to defaults</button>
    </div>
</div>
